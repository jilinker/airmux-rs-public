# Runtime settings come from the mounted config.yaml; dotenv values are generated.
name: ${AIRMUX_PROJECT_NAME:-airmux}
services:
  postgres:
    image: ${AIRMUX_POSTGRES_IMAGE:-postgres:17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?generate deployment parameters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate deployment parameters}
      POSTGRES_DB: ${POSTGRES_DB:?generate deployment parameters}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    platform: linux/amd64
    image: ${AIRMUX_APP_IMAGE:?set application image}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/airmux-api"]
    environment:
      AIRMUX_CONFIG: /etc/airmux/config.yaml
    volumes:
      - type: bind
        source: ${AIRMUX_CONFIG_FILE:-./config.yaml}
        target: /etc/airmux/config.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AIRMUX_DEPLOY_DIR:-.}
        target: ${AIRMUX_DEPLOY_DIR:?set deployment directory}
        read_only: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import yaml,urllib.request; c=yaml.safe_load(open('/etc/airmux/config.yaml')); p=c['server']['listen'].rsplit(':',1)[1]; urllib.request.urlopen('http://127.0.0.1:'+p+'/health/ready',timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
  frontend:
    platform: linux/amd64
    image: ${AIRMUX_APP_IMAGE:?set application image}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/usr/sbin/nginx"]
    command: ["-g", "daemon off;"]
    ports:
      - "${AIRMUX_HTTP_BIND:-0.0.0.0}:${AIRMUX_HTTP_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ${AIRMUX_DEPLOY_DIR:?set deployment directory}/nginx.conf
        target: /etc/nginx/conf.d/airmux.conf
        read_only: true
        bind: {create_host_path: false}
  updater:
    platform: linux/amd64
    image: ${AIRMUX_UPDATER_IMAGE:?set updater image}
    restart: unless-stopped
    profiles: [updates]
    entrypoint: ["python3", "/opt/airmux/deploy/updater.py"]
    environment:
      AIRMUX_CONFIG: /etc/airmux/config.yaml
    volumes:
      - type: bind
        source: ${AIRMUX_CONFIG_FILE:-./config.yaml}
        target: /etc/airmux/config.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AIRMUX_DEPLOY_DIR:?set deployment directory}
        target: ${AIRMUX_DEPLOY_DIR:?set deployment directory}
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${AIRMUX_DOCKER_CONFIG_FILE:?set docker credential file}
        target: /root/.docker/config.json
        read_only: true
        bind: {create_host_path: false}
      - updater-data:${AIRMUX_UPDATER_STATE_DIR:-/var/lib/airmux-updater}
volumes:
  postgres-data:
  updater-data:
