# Run `python3 deploy/manage.py init --config /srv/airmux/config.yaml` to replace placeholders.
database:
  url: "postgres://airmux:CHANGE_ME@postgres:5432/airmux"
  max_connections: 10
server:
  listen: "0.0.0.0:3000"
  allowed_origins: ["http://localhost:8080", "http://127.0.0.1:8080"]
  cookie_secure: false
auth: {session_ttl_hours: 24, password_concurrency: 8}
administrator: {username: "admin", password: "CHANGE_ME_RUN_manage_init"}
security: {encryption_key: "CHANGE_ME_RUN_manage_init"}
logging: {filter: "airmux=info,tower_http=info"}
fetch: {max_bytes: 2097152, connect_timeout_seconds: 10, total_timeout_seconds: 30, user_agent: "airmux-source-fetch/1", allowlist: []}
worker: {enabled: true, name: "api-worker", idle_poll_ms: 100, error_poll_ms: 1000}
deployment:
  mode: docker
  directory: "/srv/airmux"
  image_repository: ""
  app_image: ""
  updater_image: ""
  http_bind: "0.0.0.0"
  http_port: 8080
  project_name: "airmux"
  postgres_image: "postgres:17-bookworm"
  # External Docker PostgreSQL: set its container and network; no new database service is created.
  database_container: null
  database_network: null
  docker_config_file: null
updater:
  enabled: true
  url: "http://updater:8081"
  host: "0.0.0.0"
  port: 8081
  token: "CHANGE_ME_RUN_manage_init"
  token_file: null
  state_directory: "/var/lib/airmux-updater"
  minimum_free_bytes: 10737418240
