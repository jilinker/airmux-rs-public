# 应用配置 下载后按下列中文注释修改 再执行 docker compose up -d --wait
# 此文件含密码与密钥 请执行 chmod 600 config.yaml .env 不要提交到 Git
database:
  # 默认 Compose 自带 PostgreSQL 用户 库名为 airmux 内部地址为 postgres:5432
  # 外置 PG 使用 compose.external.yaml 填写已有数据库地址 账号和库名
  # 应用自动建表 迁移 但不会创建外置数据库 账号需有建表和迁移权限
  # 必改 替换数据库密码 并与 .env 的 POSTGRES_PASSWORD 保持一致
  # 密码建议只用字母 数字 下划线或连字符 避免 URL 转义
  url: "postgres://airmux:CHANGE_ME_DATABASE_PASSWORD@postgres:5432/airmux"
  max_connections: 10

server:
  # 邀请邮件和公开资源的站点来源 例如 https://airmux.example.com
  public_base_url: null
  # 容器内部地址 无需修改
  listen: "0.0.0.0:3000"
  # 远程访问必改 添加实际访问地址 如 http://192.168.1.10:8080 或 https://airmux.example.com
  allowed_origins: ["http://localhost:8080", "http://127.0.0.1:8080"]
  # 使用 HTTPS 时改为 true HTTP 保持 false
  cookie_secure: false

auth:
  session_ttl_hours: 24
  password_concurrency: 8
  captcha: {ttl_seconds: 180, capacity: 1024, issues_per_minute: 120}

mail: {timeout_seconds: 30, test_cooldown_seconds: 30}
worker: {enabled: true, name: "api-worker", idle_poll_ms: 100, error_poll_ms: 1000}

administrator:
  email: "admin@example.com"
  # 必改 至少 8 位 包含大小写字母仅首次创建管理员时使用 重启不会重置密码
  password: "CHANGE_ME_Admin123"

security:
  # 必改 填写 openssl rand -base64 32 的输出升级时必须保留此密钥
  encryption_key: "REPLACE_WITH_BASE64_KEY"

fetch:
  # 每次 URL 获取或文件导入的原始字节上限
  max_bytes: 2097152
  # 每次导入节点数量上限 允许一至十万
  max_nodes: 5000
  # 连接和总获取超时 单位秒
  connect_timeout_seconds: 10
  total_timeout_seconds: 30
  user_agent: "airmux-source-fetch/1"
  # 私网访问例外 必须填写精确的主机 端口和 IP
  allowlist: []
  ssh_known_hosts_file: "/var/lib/airmux-ssh/known_hosts"

logging:
  filter: "airmux=info,tower_http=info"

updater:
  enabled: true
  url: "http://updater:8081"
  # 必改 填写 openssl rand -hex 32 的输出 作为 API 与更新程序之间的凭据
  token: "REPLACE_WITH_UPDATE_TOKEN"
  state_directory: "/var/lib/airmux-updater"
  minimum_free_bytes: 10737418240
