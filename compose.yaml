# Docker 编排参数由此文件及同目录 env 文件提供
name: ${AIRMUX_PROJECT_NAME:-airmux}
services:
  postgres:
    image: ${AIRMUX_POSTGRES_IMAGE:-postgres:17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airmux}
      POSTGRES_DB: ${POSTGRES_DB:-airmux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set database initialization password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    platform: ${AIRMUX_PLATFORM:-linux/amd64}
    image: ${AIRMUX_APP_IMAGE:-${AIRMUX_IMAGE_REPOSITORY}:${AIRMUX_VERSION}}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["/usr/local/bin/airmux-api"]
    environment:
      AIRMUX_CONFIG: /etc/airmux/config.yaml
    volumes:
      - ssh-host-keys:/var/lib/airmux-ssh
      - type: bind
        source: ${AIRMUX_CONFIG_FILE:-./config.yaml}
        target: /etc/airmux/config.yaml
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "python3", "/opt/airmux/deploy/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 12
  frontend:
    platform: ${AIRMUX_PLATFORM:-linux/amd64}
    image: ${AIRMUX_APP_IMAGE:-${AIRMUX_IMAGE_REPOSITORY}:${AIRMUX_VERSION}}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    entrypoint: ["python3", "/opt/airmux/deploy/frontend.py"]
    environment:
      AIRMUX_CONFIG: /etc/airmux/config.yaml
    ports:
      - "${AIRMUX_HTTP_BIND:-0.0.0.0}:${AIRMUX_HTTP_PORT:-8080}:80"
    volumes:
      - type: bind
        source: ${AIRMUX_CONFIG_FILE:-./config.yaml}
        target: /etc/airmux/config.yaml
        read_only: true
        bind: {create_host_path: false}
  updater:
    profiles: [updates]
    platform: ${AIRMUX_PLATFORM:-linux/amd64}
    image: ${AIRMUX_UPDATER_IMAGE:-${AIRMUX_IMAGE_REPOSITORY}:${AIRMUX_VERSION}}
    restart: unless-stopped
    entrypoint: ["python3", "/opt/airmux/deploy/updater.py"]
    environment:
      AIRMUX_CONFIG: /etc/airmux/config.yaml
      AIRMUX_DEPLOY_DIR: ${AIRMUX_DEPLOY_DIR:?set absolute deployment directory}
      AIRMUX_IMAGE_REPOSITORY: ${AIRMUX_IMAGE_REPOSITORY:?set image repository}
      AIRMUX_PROJECT_NAME: ${AIRMUX_PROJECT_NAME:-airmux}
      AIRMUX_DATABASE_CONTAINER: ${AIRMUX_DATABASE_CONTAINER:-}
    volumes:
      - type: bind
        source: ${AIRMUX_CONFIG_FILE:-./config.yaml}
        target: /etc/airmux/config.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AIRMUX_DEPLOY_DIR:?set absolute deployment directory}
        target: ${AIRMUX_DEPLOY_DIR:?set absolute deployment directory}
        bind: {create_host_path: false}
      - /var/run/docker.sock:/var/run/docker.sock
      - updater-data:/var/lib/airmux-updater
volumes:
  ssh-host-keys:
  postgres-data:
  updater-data:
